name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: CLI と模範解答の型チェック
        run: npm run typecheck
      - name: 模範解答が通り、演習の初期状態が失敗することを確認
        run: npm run check:solutions
